[package]
name = "nanomp3"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Pure Rust no_std MP3 decoder. Based on minimp3"
documentation = "https://docs.rs/nanomp3"
repository = "https://github.com/robbie01/nanomp3"
authors = ["Robert B. Langer <robbie@sohio.net>"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding", "no-std", "no-std::no-alloc"]
keywords = ["audio", "codec", "decoder", "mp3", "mpeg"]

[workspace]
members = ["parity"]
exclude = ["fuzz"]

[features]
default = ["wide"]
# Use the `wide` crate for explicit SIMD. Without it, the same kernels are
# written over plain arrays and left to LLVM's auto-vectorizer.
wide = ["dep:wide"]

[dependencies]
wide = { version = "1", default-features = false, optional = true }

[dev-dependencies]
byteorder = "1.5"

