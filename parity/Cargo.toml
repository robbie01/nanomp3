[package]
name = "nanomp3-parity"
version = "0.0.0"
edition = "2021"
publish = false
description = "Bit-exact comparison of nanomp3 against upstream minimp3 (C)"

[dependencies]
nanomp3 = { path = "..", default-features = false }

[features]
default = ["wide"]
wide = ["nanomp3/wide"]

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# Frozen pre-spruce-up master, so every optimization is measured against the same baseline.
nanomp3-baseline = { package = "nanomp3", git = "https://github.com/robbie01/nanomp3", rev = "91b2d3961ffd3c4d321b6d71b4422867cd620288" }

[[bench]]
name = "decode"
harness = false
